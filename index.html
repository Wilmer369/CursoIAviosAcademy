<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VIOS ACADEMY • NEURONEXUS • LÍNEA DEL TIEMPO IA</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0c12;
            font-family: 'Space Grotesk', sans-serif;
            overflow-x: hidden;
            color: #eef5ff;
        }

        .cyber-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background: radial-gradient(circle at 20% 30%, #0a0f1a 0%, #020308 100%);
        }

        .grid-lines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                repeating-linear-gradient(0deg, rgba(0, 255, 255, 0.08) 0px, rgba(0, 255, 255, 0.08) 1px, transparent 1px, transparent 40px),
                repeating-linear-gradient(90deg, rgba(0, 255, 255, 0.08) 0px, rgba(0, 255, 255, 0.08) 1px, transparent 1px, transparent 40px);
            z-index: -1;
            pointer-events: none;
        }

        .glow-orb {
            position: fixed;
            width: 70vw;
            height: 70vw;
            background: radial-gradient(circle, rgba(0,150,255,0.15) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%;
            top: -20%;
            right: -30%;
            filter: blur(80px);
            z-index: -1;
        }

        .vios-badge {
            position: fixed;
            top: 12px;
            right: 12px;
            background: linear-gradient(135deg, #FF6B00, #FF8C00);
            width: 80px;
            height: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            box-shadow: 0 0 20px rgba(255, 107, 0, 0.6);
            border: 2px solid rgba(255, 255, 255, 0.4);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            text-align: center;
            border-radius: 16px;
        }
        
        .vios-badge:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(255, 107, 0, 0.8);
        }
        
        .vios-badge span {
            font-family: 'Space Grotesk', monospace;
            font-weight: 800;
            font-size: 0.9rem;
            letter-spacing: 1px;
            color: white;
            text-shadow: 0 0 5px rgba(0,0,0,0.5);
        }
        
        .vios-badge small {
            font-size: 0.7rem;
            display: block;
            color: #FFFFFF;
            margin-top: 4px;
        }

        ::-webkit-scrollbar {
            width: 4px;
        }
        
        ::-webkit-scrollbar-track {
            background: #0f1722;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #00c3ff;
            border-radius: 10px;
        }

        .hero {
            text-align: center;
            padding: 50px 16px 30px;
            border-bottom: 1px solid rgba(0, 242, 255, 0.3);
        }

        .hero h1 {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #FFFFFF, #00f2ff, #9d4eff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -1px;
        }

        .glitch {
            font-size: 0.75rem;
            color: #8db5ff;
            letter-spacing: 2px;
            font-family: monospace;
            margin-top: 10px;
        }

        .chip-badge {
            display: inline-flex;
            background: rgba(0, 255, 255, 0.1);
            border: 1px solid rgba(0, 255, 255, 0.4);
            border-radius: 60px;
            padding: 5px 14px;
            font-size: 0.7rem;
            margin-bottom: 15px;
            color: #0ff;
        }

        .era-tabs {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 25px 16px 20px;
            flex-wrap: wrap;
        }

        .era-btn {
            background: rgba(10, 20, 30, 0.7);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(0, 242, 255, 0.3);
            padding: 8px 18px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.25s ease;
            color: #ccc;
            border-radius: 40px;
            flex: 0 1 auto;
        }

        .era-btn.active {
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            border-color: #0ff;
            color: white;
            box-shadow: 0 0 15px rgba(0, 114, 255, 0.6);
        }

        .era-btn:hover {
            border-color: #0ff;
            color: #0ff;
            transform: translateY(-2px);
        }

        .timeline-view {
            max-width: 1300px;
            margin: 10px auto;
            padding: 10px 16px 80px;
        }

        .timeline-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .timeline-card {
            background: rgba(12, 20, 28, 0.7);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            border: 1px solid rgba(0, 242, 255, 0.25);
            cursor: pointer;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .timeline-card:hover {
            border-color: #0ff;
            transform: translateX(5px);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
        }

        .card-header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: baseline;
            padding: 14px 18px 6px 18px;
            border-bottom: 1px dashed rgba(0,255,255,0.2);
            gap: 8px;
        }

        .year {
            font-size: 1.4rem;
            font-weight: 800;
            background: linear-gradient(145deg, #fff, #70f0ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .milestone-name {
            font-size: 1rem;
            font-weight: 600;
            color: #ffde9c;
        }

        .badge-era {
            background: rgba(0, 0, 0, 0.5);
            padding: 3px 10px;
            border-radius: 60px;
            font-size: 0.6rem;
            border-left: 2px solid cyan;
        }

        .card-content {
            padding: 10px 18px 16px 18px;
        }

        .desc {
            font-size: 0.85rem;
            opacity: 0.85;
            line-height: 1.4;
        }

        .expand-icon {
            margin-top: 10px;
            color: #0ff;
            font-size: 0.75rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .extra-info {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease-out;
            background: rgba(0, 50, 70, 0.3);
            border-radius: 14px;
            margin-top: 10px;
        }

        .extra-info.show {
            max-height: 400px;
            padding: 12px 14px;
        }

        .extra-text {
            font-size: 0.8rem;
            color: #b0e0ff;
            margin-bottom: 10px;
        }

        .media-resource {
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px dashed rgba(0,255,255,0.3);
        }
        
        .media-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(0,0,0,0.5);
            padding: 8px 14px;
            border-radius: 40px;
            color: #FFD966;
            text-decoration: none;
            font-size: 0.7rem;
            transition: 0.2s;
            margin-right: 8px;
            margin-bottom: 8px;
        }
        
        .media-link:hover {
            background: #FF8C00;
            color: black;
        }
        
        .video-short-btn {
            background: linear-gradient(135deg, #FF0000, #CC0000);
            color: white;
            font-weight: bold;
        }
        
        .video-short-btn:hover {
            background: linear-gradient(135deg, #FF3333, #FF0000);
            transform: scale(1.02);
        }
        
        .qr-mini {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: #1a2a3a;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.65rem;
            cursor: pointer;
        }
        
        .ar-mini-btn {
            margin-top: 12px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(95deg, #0a2e3a, #001e2a);
            border: 1px solid #0ff;
            border-radius: 40px;
            padding: 6px 14px;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            color: #0ff;
        }

        .ar-mini-btn:hover {
            background: #0ff;
            color: black;
            box-shadow: 0 0 12px cyan;
        }

        .ar-panel {
            position: fixed;
            bottom: 15px;
            left: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(16px);
            border-radius: 60px;
            padding: 10px 16px;
            border: 1px solid cyan;
            display: flex;
            justify-content: space-around;
            gap: 8px;
            z-index: 1000;
        }

        .ar-panel button {
            background: none;
            border: none;
            color: white;
            font-size: 0.7rem;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 8px;
            border-radius: 40px;
            flex: 1;
            justify-content: center;
        }

        .ar-panel button:hover {
            background: rgba(0, 255, 255, 0.2);
            color: cyan;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(12px);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            visibility: hidden;
            opacity: 0;
            transition: 0.2s;
        }

        .modal-overlay.active {
            visibility: visible;
            opacity: 1;
        }

        .modal-content {
            background: #0b162ae6;
            border: 1.5px solid cyan;
            border-radius: 30px;
            max-width: 500px;
            width: 90%;
            padding: 24px;
            text-align: center;
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.4);
        }

        .modal-content h3 {
            font-size: 1.3rem;
            margin-bottom: 12px;
        }
        
        .modal-detail {
            font-size: 0.85rem;
            line-height: 1.5;
        }
        
        .close-modal {
            background: cyan;
            border: none;
            padding: 10px 22px;
            border-radius: 60px;
            font-weight: bold;
            margin-top: 15px;
            cursor: pointer;
        }

        @media (max-width: 600px) {
            .hero h1 { font-size: 1.6rem; }
            .year { font-size: 1.2rem; }
            .milestone-name { font-size: 0.85rem; }
            .era-btn { padding: 6px 14px; font-size: 0.75rem; }
            .vios-badge { width: 65px; height: 65px; top: 8px; right: 8px; border-radius: 12px; }
            .vios-badge span { font-size: 0.75rem; }
            .vios-badge small { font-size: 0.6rem; }
            .ar-panel button { font-size: 0.6rem; flex-direction: column; gap: 3px; }
            .ar-panel button i { font-size: 1rem; }
        }
    </style>
</head>
<body>
<div class="cyber-bg"></div>
<div class="grid-lines"></div>
<div class="glow-orb"></div>

<div class="vios-badge" onclick="window.open('https://viosacademy.com', '_blank')">
    <span>VIOS</span>
    <small>ACADEMY</small>
</div>

<div class="hero">
    <div class="chip-badge"><i class="fas fa-brain"></i> Ing. Wilmer Montilla V 1.5.26</div>
    <h1>◢ LÍNEA DEL TIEMPO IA ◣</h1>
    <div class="glitch">// PASADO | PRESENTE | FUTURO — Evolución Sintética</div>
</div>

<div class="era-tabs">
    <button class="era-btn" data-era="past">🔮 PASADO (1950-2011)</button>
    <button class="era-btn active" data-era="present">⚡ PRESENTE (2012-2025)</button>
    <button class="era-btn" data-era="future">🚀 FUTURO (2026-2050+)</button>
</div>

<div class="timeline-view">
    <div class="timeline-grid" id="timelineGrid"></div>
</div>

<div class="ar-panel">
    <button id="arQuickPast"><i class="fas fa-vr-cardboard"></i> <span>AR PASADO</span></button>
    <button id="arQuickPresent"><i class="fas fa-glasses"></i> <span>AR PRESENTE</span></button>
    <button id="arQuickFuture"><i class="fas fa-microchip"></i> <span>AR FUTURO</span></button>
</div>

<div id="infoModal" class="modal-overlay">
    <div class="modal-content">
        <h3 id="modalTitle">🧠 Hito IA</h3>
        <div id="modalDetail" class="modal-detail"></div>
        <button class="close-modal" id="closeModalBtn">CERRAR</button>
    </div>
</div>

<script>
    const timelineData = {
        past: [
            { year: "1950", title: "Test de Turing", desc: "Alan Turing publica 'Computing Machinery and Intelligence'.", extra: "Propone el famoso Test de Turing como medida de inteligencia artificial.", media: { type: "short", url: "https://www.youtube.com/shorts/M0xDzUGv3Hg", title: "📱 ¿Qué es el Test de Turing?" } },
            { year: "1956", title: "Conferencia de Dartmouth", desc: "Nace oficialmente la Inteligencia Artificial.", extra: "John McCarthy acuña el término 'Inteligencia Artificial'.", media: { type: "short", url: "https://www.youtube.com/shorts/4F25Grn304c", title: "📱 Historia Dartmouth" } },
            { year: "1966", title: "ELIZA", desc: "Primer chatbot de la historia.", extra: "Desarrollado en MIT por Joseph Weizenbaum.", media: { type: "qr", content: "https://es.wikipedia.org/wiki/ELIZA", title: "📱 Escanea para saber más" } },
            { year: "1997", title: "Deep Blue", desc: "IBM vence a Kasparov en ajedrez.", extra: "Hito histórico en juego computacional. La primera vez que una máquina vence a un campeón mundial.", media: { type: "short", url: "https://www.youtube.com/shorts/tq9T78ZakPM", title: "🎥 Deep Blue vs Kasparov" } },
            { year: "2011", title: "Watson y Siri", desc: "IBM gana Jeopardy! y Apple lanza Siri.", extra: "Popularización de asistentes inteligentes en dispositivos móviles.", media: { type: "link", url: "https://www.bbc.com/mundo/noticias/2011/02/110217_ibm_computadora_jeopardy_en", title: "🔗 IBM Watson" } }
        ],
        present: [
            { year: "2012", title: "AlexNet", desc: "Revoluciona la visión por computadora.", extra: "Inicia la era del Deep Learning moderno. Gana ImageNet con un error del 15.3%.", media: { type: "short", url: "https://www.youtube.com/watch?v=07pnnfHaQCA", title: "📺 AlexNet y el Deep Learning" } },
            { year: "2016", title: "AlphaGo", desc: "DeepMind vence a campeón mundial de Go.", extra: "Hito en inteligencia estratégica. El Go es 10^100 veces más complejo que el ajedrez.", media: { type: "qr", content: "https://deepmind.com/research/highlighted-research/alphago", title: "📱 AlphaGo documentary" } },
            { year: "2017", title: "Transformer", desc: "Nace la arquitectura que impulsa GPT.", extra: "Paper 'Attention Is All You Need' de Google Brain.", media: { type: "short", url: "https://www.youtube.com/shorts/eHL85i1wBkk?t=33&feature=share", title: "🎥 Arquitectura Transformer" } },
            { year: "2022", title: "ChatGPT", desc: "Boom de la IA generativa global.", extra: "100 millones de usuarios en 2 meses. La adopción más rápida de la historia.", media: { type: "link", url: "https://openai.com/es-419/business/guides-and-resources/chatgpt-usage-and-adoption-patterns-at-work/", title: "🔗 ChatGPT oficial" } },
            { year: "2024", title: "GPT-4o y Sora", desc: "IA multimodal y generación de video.", extra: "Razonamiento en tiempo real y creación de video desde texto.", media: { type: "short", url: "https://www.youtube.com/live/i4t7L2oKWkQ?si=MUmWggyVQvI8HzM7", title: "📺 GPT-4o y el futuro multimodal" } }
        ],
        future: [
            { year: "2026-2028", title: "IA Co-Doctor", desc: "Diagnósticos médicos con >99% precisión.", extra: "Revolución en salud preventiva y diagnósticos tempranos.", media: { type: "short", url: "https://youtu.be/1hK4T-L2XFE?si=ktU2QIGylBGE7rt1", title: "📱¿El futuro de la medicina?" } },
            { year: "2030-2035", title: "AGI", desc: "Inteligencia Artificial General nivel humano.", extra: "Capacidad de razonamiento transversal como un humano.", media: { type: "short", url: "https://www.youtube.com/shorts/Jbggoi35p5s", title: "🎥 ¿Qué es la AGI?" } },
            { year: "2035-2040", title: "ASI", desc: "Superinteligencia superior a humanos.", extra: "Debate ético y control de IA. ¿Podremos controlarla?", media: { type: "qr", content: "https://nickbostrom.com/superintelligence", title: "📱 Superinteligencia (Bostrom)" } },
            { year: "2050+", title: "Singularidad", desc: "IA se mejora a sí misma exponencialmente.", extra: "Futuro impredecible, según Ray Kurzweil. Esperamos para 2045.", media: { type: "short", url: "https://www.youtube.com/shorts/4hRWil6lUQ0", title: "📺 La Singularidad Tecnológica" } }
        ]
    };

    let currentEra = "present";

    function getMediaHTML(media) {
        if (!media) return '';
        if (media.type === 'short') {
            return `<div class="media-resource">
                        <a href="${media.url}" target="_blank" class="media-link video-short-btn"><i class="fab fa-youtube"></i> ${media.title} ⚡</a>
                    </div>`;
        } else if (media.type === 'video') {
            return `<div class="media-resource">
                        <a href="${media.url}" target="_blank" class="media-link"><i class="fab fa-youtube"></i> ${media.title}</a>
                    </div>`;
        } else if (media.type === 'link') {
            return `<div class="media-resource">
                        <a href="${media.url}" target="_blank" class="media-link"><i class="fas fa-external-link-alt"></i> ${media.title}</a>
                    </div>`;
        } else if (media.type === 'qr') {
            const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=${encodeURIComponent(media.content)}`;
            return `<div class="media-resource">
                        <div class="qr-mini" onclick="window.open('${media.content}', '_blank')">
                            <img src="${qrUrl}" width="35" height="35" style="border-radius: 8px;"> 
                            <span>${media.title}</span>
                        </div>
                    </div>`;
        }
        return '';
    }

    function renderTimeline(eraKey) {
        const data = timelineData[eraKey];
        const grid = document.getElementById("timelineGrid");
        if (!grid) return;
        grid.innerHTML = "";
        data.forEach((item, idx) => {
            const card = document.createElement("div");
            card.className = "timeline-card";
            
            const mediaHtml = getMediaHTML(item.media);
            
            card.innerHTML = `
                <div class="card-header">
                    <span class="year">${item.year}</span>
                    <span class="milestone-name">${item.title}</span>
                    <span class="badge-era">${eraKey === 'past' ? 'ORIGEN' : eraKey === 'present' ? 'ACTUAL' : 'NEXUS'}</span>
                </div>
                <div class="card-content">
                    <p class="desc">${item.desc}</p>
                    <div class="expand-icon"><i class="fas fa-chevron-circle-down"></i> MÁS INFO + RECURSOS</div>
                    <div class="extra-info">
                        <div class="extra-text">🔍 ${item.extra}</div>
                        ${mediaHtml}
                        <div class="ar-mini-btn" data-era="${eraKey}" data-hito="${item.title}"><i class="fas fa-cube"></i> VER EN REALIDAD AUMENTADA</div>
                    </div>
                </div>
            `;
            
            const expandIcon = card.querySelector(".expand-icon");
            const extraDiv = card.querySelector(".extra-info");
            expandIcon.addEventListener("click", (e) => {
                e.stopPropagation();
                if (extraDiv.classList.contains("show")) {
                    extraDiv.classList.remove("show");
                    expandIcon.innerHTML = '<i class="fas fa-chevron-circle-down"></i> MÁS INFO + RECURSOS';
                } else {
                    extraDiv.classList.add("show");
                    expandIcon.innerHTML = '<i class="fas fa-chevron-circle-up"></i> MENOS INFO';
                }
            });
            
            const arBtn = card.querySelector(".ar-mini-btn");
            arBtn.addEventListener("click", (e) => {
                e.stopPropagation();
                const era = arBtn.getAttribute("data-era");
                openAR(era);
            });
            
            card.addEventListener("click", () => {
                let mediaMsg = "";
                if (item.media) {
                    if (item.media.type === 'short') mediaMsg = `\n\n📱 YouTube Short: ${item.media.url}`;
                    else if (item.media.type === 'video') mediaMsg = `\n\n🎬 Recurso: ${item.media.title}\n🔗 ${item.media.url}`;
                    else if (item.media.type === 'link') mediaMsg = `\n\n🔗 Enlace: ${item.media.url}`;
                    else if (item.media.type === 'qr') mediaMsg = `\n\n📱 Más info: ${item.media.content}`;
                }
                showModal(item.title, `${item.desc}\n\n📌 ${item.extra}${mediaMsg}`);
            });
            
            grid.appendChild(card);
        });
    }

    function showModal(title, detail) {
        document.getElementById("modalTitle").innerHTML = `🧩 ${title}`;
        document.getElementById("modalDetail").innerHTML = `<strong>${detail.replace(/\n/g, '<br>')}</strong>`;
        document.getElementById("infoModal").classList.add("active");
    }

    function openAR(era) {
        window.location.href = `ar.html?era=${era}`;
    }

    function setActiveEra(eraKey) {
        currentEra = eraKey;
        renderTimeline(eraKey);
        document.querySelectorAll(".era-btn").forEach(btn => {
            if (btn.getAttribute("data-era") === eraKey) {
                btn.classList.add("active");
            } else {
                btn.classList.remove("active");
            }
        });
    }

    document.querySelectorAll(".era-btn").forEach(btn => {
        btn.addEventListener("click", () => {
            setActiveEra(btn.getAttribute("data-era"));
        });
    });

    document.getElementById("arQuickPast").addEventListener("click", () => openAR("past"));
    document.getElementById("arQuickPresent").addEventListener("click", () => openAR("present"));
    document.getElementById("arQuickFuture").addEventListener("click", () => openAR("future"));

    document.getElementById("closeModalBtn").addEventListener("click", () => {
        document.getElementById("infoModal").classList.remove("active");
    });
    
    document.getElementById("infoModal").addEventListener("click", (e) => {
        if (e.target === document.getElementById("infoModal")) {
            document.getElementById("infoModal").classList.remove("active");
        }
    });

    setActiveEra("present");
</script>
</body>
</html>
